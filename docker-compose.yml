version: '3.8'

services:
  # Servizio Database MongoDB
  db:
    image: mongo:latest
    container_name: taw_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Servizio Backend Node.js / Express
  backend:
    build: ./backend
    container_name: taw_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://db:27017/taw_overseas
      - JWT_SECRET=super_secret_key_taw_2026
    depends_on:
      - db

  # Servizio Frontend Angular / Nginx
  frontend:
    build: ./frontend
    container_name: taw_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
